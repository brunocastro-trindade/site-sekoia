  <!-- Trusted Types: política "default" passa-tudo. Existe só pra satisfazer o
       require-trusted-types-for do CSP sem quebrar o GTM/Meta Pixel/Clarity —
       os três atribuem string crua a element.src (script.src = "https://...")
       internamente, código deles que não editamos. Isso NÃO sanitiza nada de
       verdade; uma política restritiva de verdade exigiria interceptar/validar
       cada uso, inviável com scripts de terceiros que mudam sem deploy nosso.
       Precisa rodar antes de qualquer outro script no <head>. -->
  <script>
    if (window.trustedTypes && trustedTypes.createPolicy) {
      trustedTypes.createPolicy('default', {
        createHTML: (s) => s,
        createScript: (s) => s,
        createScriptURL: (s) => s,
      });
    }
  </script>

  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);

  <!-- Microsoft Clarity — adiado até a página terminar de carregar (idle).
       Clarity é gravação de sessão/heatmap, não afeta conversão nem atribuição de mídia paga,
       então não precisa competir por main thread durante o carregamento crítico. -->
  <script type="text/javascript">
    (function () {
      function loadClarity() {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y5fkfkzd16");
      }
      var schedule = window.requestIdleCallback || function (cb) { setTimeout(cb, 1); };
      if (document.readyState === 'complete') schedule(loadClarity);
      else window.addEventListener('load', function () { schedule(loadClarity); });
    })();
  </script>
  <!-- End Microsoft Clarity -->

  <!-- Dados estruturados (JSON-LD) — sinaliza aos buscadores quem é a Sekoia.
       PENDENTE: incluir "address" (PostalAddress com streetAddress/addressLocality/
       postalCode) e trocar areaServed "BR" pela cidade/região real. Sem o endereço
       físico o Google trata a Sekoia como negócio sem localização e ela fica fora
       do pack local, que é onde está a busca com intenção comercial.
       Não preenchemos com dado inventado de propósito: endereço falso em schema é
       violação de diretriz e pode gerar ação manual. -->

  <!-- Meta Pixel Code -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments)
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0;
      t.src = v; s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s)
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1217330763796782');

    // PageView com event_id compartilhado: o mesmo id vai no fbq (navegador) e
    // em /api/meta-capi (servidor) — o Meta desduplica o par por event_id.
    (function () {
      var eid = (self.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'pv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      fbq('track', 'PageView', {}, { eventID: eid });
      var sendCapi = function () {
        // Pequeno atraso para o fbevents.js criar o cookie _fbp, que o servidor
        // lê da request e repassa à CAPI (melhora o casamento de identidade).
        setTimeout(function () {
          try {
            fetch('/api/meta-capi', {
              method: 'POST',
              keepalive: true,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                event_name: 'PageView',
                event_id: eid,
                event_source_url: location.href
              })
            }).catch(function () { });
          } catch (e) { /* tracking nunca quebra a página */ }
        }, 1200);
      };
      if (document.readyState === 'complete') sendCapi();
      else addEventListener('load', sendCapi);
    })();
  </script>
  <!-- End Meta Pixel Code -->

  <!-- Google tag (gtag) stub — o GA4 (G-WL23JBFN9W) já é carregado pelo GTM (GTM-K4S4LR9C),
       então NÃO carregamos gtag.js aqui de novo (evita download duplicado + page_view duplicado).

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;
  </script>
  <!-- End Google tag stub -->
